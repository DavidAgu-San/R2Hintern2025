<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <title>Interactive Timeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<header class="header-techy">
  <img src="Tesla motor.png" alt="Logo" class="header-logo" />
  <h1 class="header-title">Interactive Timeline</h1>
</header>

<body class="bg-gray-100">
  <div class="max-w-2xl mx-auto p-4">
    <ul id="timeline" class="timeline timeline-vertical"></ul>
  </div>
  <div id="popup" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
    <div class="bg-white p-6 rounded shadow-lg max-w-xs">
      <button onclick="closePopup()" class="float-right text-gray-400 hover:text-gray-700">&times;</button>
      <div id="popup-content"></div>
    </div>
  </div>


  <script src="script.js"></script>

</body>
</html>
