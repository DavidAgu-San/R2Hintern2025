<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movie Search App</title>

      <!-- Tailwind CDN-->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen font-sans">

    <div class="max-w-6xl mx-auto px-6 py-8">

            <!-- Header-->
            <header class="mb-10 text-center">
                  <h1 class="text-5xl font-extrabold text-blue-600 tracking-tight mb-4">🎬 Movie Search</h1>
                  <p class="text-gray-600 max-w-xl mx-auto">Search top movies and filter by genre and year</p>
                </header>

            <!-- Search Form -->
            <form id="search-form" class="flex flex-wrap justify-center gap-4 mb-12" novalidate>
                  <input id="title" type="text" placeholder="Search by title..." required class="flex-grow min-w-[250px] max-w-xl rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm"/>
                  <input id="genre" type="text" placeholder="Genre (optional)" class="w-48 rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm"/>
                  <input id="year" type="number" placeholder="Year (optional)" min="1900" max="2099" step="1" class="w-32 rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm"/>
                  <button type="submit" class="rounded-lg bg-blue-600 px-6 py-3 text-white font-semibold shadow-md hover:bg-blue-700 transition">search</button>
                </form>

            <!-- Movies Grid -->
            <main>
                <div id="results" class="grid gap-8 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"      ></div>
            </main>
        </div>

    >
    <script src="script.js"></script>
</body>

</html>
