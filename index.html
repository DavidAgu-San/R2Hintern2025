
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="">
    <title>Movie Searcher</title>

      <!-- Tailwind CDN-->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-emerald-100 via-green-50 to-emerald-200 text-gray-900 min-h-screen font-sans">

    <div class="max-w-6xl mx-auto px-6 py-8">

            <!-- Header-->
            <header class="mb-10 text-center">
                  <h1 class="text-6xl font-extrabold bg-gradient-to-r from-emerald-700 via-green-600 to-emerald-800 bg-clip-text text-transparent drop-shadow-lg mb-3">🎬 Movie Search</h1>
                  <p class="text-emerald-600 max-w-xl mx-auto">Search movies and filter by genre and year</p>
                </header>

            <!-- Search Form -->
            <form id="search-form" class="flex flex-wrap justify-center gap-4 mb-12" novalidate>
                  <input id="title" type="text" placeholder="Search by title..." required class="flex-grow min-w-[250px] max-w-xl rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm"/>
                  <input id="genre" type="text" placeholder="Genre (optional)" class="w-48 rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm"/>
                  <input id="year" type="number" placeholder="Year (optional)" min="1900" max="2099" step="1" class="w-32 rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm"/>
                  <button type="submit" class="rounded-xl bg-gradient-to-r from-green-400 via-emerald-300 to-green-500 px-8 py-4 text-white font-semibold shadow-lg hover:from-green-500 hover:to-emerald-400 active:scale-95 transition-transform duration-150">search</button>
                </form>

            <!-- Movies Grid -->
            <main>
                <div id="results" class="grid gap-8 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"      ></div>
            </main>
        </div>

    >
    <script src="script.js"></script>
</body>

</html>
